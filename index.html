<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم - مركز التكوين المهني</title>
<style>
body{font-family:Tahoma, sans-serif; background:#f1f5f9; padding:20px;}
.container{max-width:900px; margin:0 auto; background:#fff; padding:20px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.1);}
h1{color:#1e40af; text-align:center;}
.login-box{text-align:center; padding:40px;}
input[type="password"]{padding:12px; font-size:18px; border:2px solid #ccc; border-radius:8px; width:300px; margin-bottom:15px;}
button{padding:12px 30px; font-size:16px; background:#059669; color:#fff; border:none; border-radius:8px; cursor:pointer;}
button:hover{background:#047857;}
.record{background:#f8fafc; border-right:4px solid #1e40af; padding:15px; margin-bottom:10px; border-radius:8px;}
.record .row{display:flex; justify-content:space-between; flex-wrap:wrap; margin-bottom:5px;}
.record strong{color:#1e40af;}
.delete-btn{background:#dc2626; color:#fff; border:none; padding:5px 15px; border-radius:5px; cursor:pointer; font-size:14px;}
.hidden{display:none;}
</style>
</head>
<body>

<div class="container">
  <h1>🔐 لوحة التحكم - سبر الآراء</h1>
  
  <!-- شاشة تسجيل الدخول -->
  <div id="loginSection" class="login-box">
    <p>أدخل كلمة المرور للوصول إلى المشاركات:</p>
    <input type="password" id="adminPass" placeholder="كلمة المرور...">
    <br>
    <button onclick="login()">دخول</button>
    <p id="loginMsg" style="color:red;"></p>
  </div>

  <!-- قسم عرض المشاركات -->
  <div id="dashboardSection" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2>📋 المشاركات (<span id="count">0</span>)</h2>
      <button onclick="loadRecords()" style="background:#1e40af;">🔄 تحديث</button>
    </div>
    <div id="recordsList"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // ⚠️ ضع نفس إعدادات Firebase هنا
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ⚠️ ضع نفس كلمة المرور التي وضعتها في Firestore Rules
  const ADMIN_PASSWORD = "YOUR_SECRET_PASSWORD";

  window.login = function() {
    const pass = document.getElementById('adminPass').value;
    if (pass === ADMIN_PASSWORD) {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      loadRecords();
    } else {
      document.getElementById('loginMsg').textContent = "❌ كلمة المرور غير صحيحة";
    }
  };

  window.loadRecords = async function() {
    const list = document.getElementById('recordsList');
    const countSpan = document.getElementById('count');
    list.innerHTML = '<p>⏳ جاري التحميل...</p>';

    try {
      // ملاحظة هامة: لقراءة البيانات من Firestore مع قاعدة الأمان التي تتطلب adminPass،
      // يجب أن نمرر كلمة المرور في الاستعلام. SDK لا يسمح بذلك مباشرة.
      // الحل: نستخدم getDocs عادية، ولكن قاعدة الأمان ستسمح بذلك فقط إذا كان المستخدم لديه صلاحية.
      // بما أنك تستخدم كلمة مرور محلية، سنعتمد على قاعدة أمان تسمح بالقراءة للجميع مؤقتاً (للتجربة فقط).
      // ⚠️ لتأمينها: استخدم Firebase Authentication (سأشرحه لك لاحقاً إذا أردت).
      
      const q = query(collection(db, "cnf_wadi_moura_survey"), orderBy("createdAt", "desc"));
      const snapshot = await getDocs(q);
      
      if (snapshot.empty) {
        list.innerHTML = '<p style="text-align:center; color:#94a3b8;">لا توجد مشاركات بعد.</p>';
        countSpan.textContent = '0';
        return;
      }

      countSpan.textContent = snapshot.size;
      list.innerHTML = '';

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const date = data.createdAt ? data.createdAt.toDate().toLocaleString('ar-DZ') : 'غير محدد';
        
        const card = document.createElement('div');
        card.className = 'record';
        card.innerHTML = `
          <div class="row">
            <div><strong>👤 الاسم:</strong> ${data.name}</div>
            <div><strong>📞 الهاتف:</strong> ${data.phone}</div>
          </div>
          <div class="row">
            <div><strong>🎯 التخصص:</strong> <span style="color:#dc2626; font-weight:bold;">${data.specialty}</span></div>
          </div>
          <div style="background:#fff; padding:10px; border-radius:5px; margin:5px 0;">
            <strong>💡 المقترح:</strong> ${data.suggestion}
          </div>
          <div class="row" style="align-items:center;">
            <div style="font-size:12px; color:#64748b;">🕐 ${date}</div>
            <button class="delete-btn" data-id="${docSnap.id}">🗑️ حذف</button>
          </div>
        `;
        list.appendChild(card);
      });

      // إضافة أحداث الحذف
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (!confirm('هل أنت متأكد من حذف هذه المشاركة؟')) return;
          const id = e.target.getAttribute('data-id');
          try {
            await deleteDoc(doc(db, "cnf_wadi_moura_survey", id));
            loadRecords();
          } catch (error) {
            alert('خطأ في الحذف: ' + error.message);
          }
        });
      });

    } catch (error) {
      console.error(error);
      list.innerHTML = '<p style="color:red;">خطأ في جلب البيانات: ' + error.message + '</p>';
    }
  };
</script>

</body>
</html>
