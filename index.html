<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إحصائيات الناخبين</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:#f0f4f8; color:#1e293b;
  font-family:Tahoma,Arial,sans-serif; line-height:1.8; padding:20px;
}
.box{
  max-width:520px; margin:0 auto; background:#fff; border-radius:20px;
  padding:25px; box-shadow:0 10px 30px rgba(0,0,0,.08);
}
h1{ text-align:center; color:#1e40af; font-size:24px; margin:0 0 5px; }
.sub{ text-align:center; color:#64748b; font-size:14px; margin-bottom:20px; }

label{ display:block; font-weight:bold; color:#1e40af; margin:15px 0 5px; }
input{
  width:100%; padding:14px; font-size:20px; text-align:center; font-weight:bold;
  border:2px solid #e2e8f0; border-radius:12px; background:#f8fafc;
  font-family:inherit; transition:.2s;
}
input:focus{ outline:none; border-color:#1e40af; background:#fff; }

hr{ border:none; border-top:2px dashed #cbd5e1; margin:25px 0; }

.pct{
  text-align:center; font-size:32px; font-weight:900; color:#059669;
  margin-top:8px; font-family:Arial,sans-serif;
}
.pct small{ display:block; font-size:13px; color:#64748b; font-weight:bold; }

.pct.blue{ color:#1e40af; }
.pct.pink{ color:#db2777; }

.actions{ text-align:center; margin-top:25px; }
button{
  padding:12px 24px; font-size:16px; font-weight:bold; border:none;
  border-radius:12px; cursor:pointer; font-family:inherit; margin:5px;
}
.save{ background:#059669; color:#fff; }
.save:hover{ background:#047857; }
.reset{ background:#dc2626; color:#fff; }
.reset:hover{ background:#b91c1c; }

.msg{ text-align:center; font-weight:bold; margin-top:12px; min-height:22px; font-size:14px; }
.saved{ color:#059669; }
.err{ color:#dc2626; }

.info{
  text-align:center; font-size:12px; color:#94a3b8; margin-top:20px;
  border-top:1px solid #e2e8f0; padding-top:12px;
}
</style>
</head>
<body>

<div class="box">
  <h1>🗳️ إحصائيات الناخبين</h1>
  <p class="sub">الأرقام تُحفظ تلقائياً في متصفحك</p>

  <label>📊 المجموع الكلي</label>
  <input type="number" id="total" min="0" placeholder="0" oninput="save()">

  <hr>

  <label>👨 عدد الرجال</label>
  <input type="number" id="men" min="0" placeholder="0" oninput="save()">
  <div class="pct blue" id="menPct">0%<small>نسبة الرجال</small></div>

  <hr>

  <label>👩 عدد النساء</label>
  <input type="number" id="women" min="0" placeholder="0" oninput="save()">
  <div class="pct pink" id="womenPct">0%<small>نسبة النساء</small></div>

  <div class="actions">
    <button class="save" onclick="save(true)">💾 حفظ</button>
    <button class="reset" onclick="resetAll()">🗑️ مسح الكل</button>
  </div>
  <div class="msg" id="msg"></div>

  <div class="info">
    👨‍💻 تطوير: براهيمي يوسف — مطور برامج وتطبيقات<br>
    شريد علوي — عرعار وادي مرة
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// تحميل القيم المحفوظة عند فتح الصفحة
function load(){
  $('total').value = localStorage.getItem('v_total') || '';
  $('men').value   = localStorage.getItem('v_men')   || '';
  $('women').value = localStorage.getItem('v_women') || '';
  updatePct();
}

// حفظ القيم + حساب النسب
function save(showMsg){
  const t = $('total').value;
  const m = $('men').value;
  const w = $('women').value;

  localStorage.setItem('v_total', t);
  localStorage.setItem('v_men', m);
  localStorage.setItem('v_women', w);

  updatePct();

  if(showMsg){
    $('msg').textContent = '✅ تم الحفظ بنجاح';
    $('msg').className = 'msg saved';
    setTimeout(()=>{ $('msg').textContent=''; }, 2000);
  }
}

// حساب النسب
function updatePct(){
  const total = parseFloat($('total').value) || 0;
  const men   = parseFloat($('men').value)   || 0;
  const women = parseFloat($('women').value) || 0;

  const menPct   = total > 0 ? (men   / total * 100) : 0;
  const womenPct = total > 0 ? (women / total * 100) : 0;

  $('menPct').innerHTML   = menPct.toFixed(2)   + '%<small>نسبة الرجال</small>';
  $('womenPct').innerHTML = womenPct.toFixed(2) + '%<small>نسبة النساء</small>';
}

// مسح الكل
function resetAll(){
  if(!confirm('هل تريد مسح كل الأرقام؟')) return;
  localStorage.removeItem('v_total');
  localStorage.removeItem('v_men');
  localStorage.removeItem('v_women');
  $('total').value = '';
  $('men').value = '';
  $('women').value = '';
  updatePct();
  $('msg').textContent = '🗑️ تم المسح';
  $('msg').className = 'msg err';
  setTimeout(()=>{ $('msg').textContent=''; }, 2000);
}

// تشغيل عند فتح الصفحة
load();
</script>

</body>
</html>
