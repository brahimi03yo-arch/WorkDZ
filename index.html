<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توقيت ماستر علم الاجتماع التنظيم والعمل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-hover: rgba(51, 65, 85, 0.9);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.4);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            padding-bottom: 50px;
        }

        /* --- Header & Active Bar --- */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Active Bar (Top) */
        #activeBar {
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.15), transparent);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 10px 20px;
            display: none;
            align-items: center;
            gap: 20px;
            margin: 20px 30px;
            box-shadow: 0 4px 20px var(--primary-glow);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .active-info {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 1.1rem;
        }

        .active-badge {
            background: var(--primary);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* --- Layout --- */
        .main-container {
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* --- Panels (Search, Reminders, Notes) --- */
        .panels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .panel h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .list-items {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .list-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 3px solid var(--primary);
            font-size: 0.9rem;
        }

        /* --- Schedule Grid --- */
        .schedule-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            overflow-x: auto;
            backdrop-filter: blur(10px);
        }

        .schedule-table {
            display: grid;
            grid-template-columns: 100px repeat(7, 1fr);
            gap: 10px;
            min-width: 1000px;
        }

        .s-header {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--primary);
            border: 1px solid var(--border);
        }

        .s-day {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 10px;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }

        .s-cell {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            min-height: 90px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .s-cell:hover {
            background: var(--surface-hover);
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            transform: scale(1.02);
        }

        .s-cell.empty {
            cursor: default;
            opacity: 0.3;
        }

        .s-cell.empty:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--border);
            box-shadow: none;
            transform: none;
        }

        .s-subject {
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #e2e8f0;
        }

        .s-prof {
            font-size: 0.75rem;
            color: var(--primary);
            margin-bottom: 3px;
        }

        .s-room {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            width: fit-content;
        }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: #1e293b;
            border: 1px solid var(--primary);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: modalScale 0.3s ease;
        }

        @keyframes modalScale {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 15px; left: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover { color: var(--danger); }

        .modal h2 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        .modal-day {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: block;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 2000;
        }
        
        .toast.show {
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>ماستر علم الاجتماع التنظيم والعمل</h1>
            <p>السنة أولى - توقيت الحصص والملاحظات</p>
        </div>
        <div>
            <button class="btn btn-danger" onclick="localStorage.clear(); location.reload();" style="font-size: 0.8rem; padding: 8px 15px;">مسح البيانات</button>
        </div>
    </header>

    <!-- شريط الحصة المحددة -->
    <div id="activeBar">
        <span class="active-badge">الحصة المحددة</span>
        <div class="active-info">
            <strong id="abDay">—</strong>
            <span>|</span>
            <span id="abSubject" style="color: var(--primary);">—</span>
            <span>|</span>
            <span id="abProf">—</span>
        </div>
    </div>

    <div class="main-container">
        <!-- الأقسام الجانبية (بحث، تذكير، ملاحظات الامتحان) -->
        <div class="panels-grid">
            <!-- بحث الطلبة -->
            <div class="panel">
                <h2>🔍 بحث الطلبة المشتركين</h2>
                <div class="input-group">
                    <input type="text" id="searchTitle" placeholder="عنوان البحث...">
                    <input type="text" id="searchValue" placeholder="قيمة/عدد الطلبة المشتركين...">
                    <button class="btn" onclick="addSearch()">حفظ البحث</button>
                </div>
                <ul class="list-items" id="searchList"></ul>
            </div>

            <!-- التذكيرات -->
            <div class="panel">
                <h2>🔔 تذكيرات هامة</h2>
                <div class="input-group">
                    <input type="text" id="reminderInput" placeholder="اكتب تذكيراً لأمر ما...">
                    <button class="btn" onclick="addReminder()">إضافة تذكير</button>
                </div>
                <ul class="list-items" id="reminderList"></ul>
            </div>

            <!-- ملاحظات الحصص للامتحان -->
            <div class="panel">
                <h2>📝 ملاحظاتي (يوم الامتحان)</h2>
                <ul class="list-items" id="examNotesList">
                    <li class="list-item" style="justify-content: center; color: var(--text-muted); border: none;">اضغط على أي حصة في الجدول لإضافة ملاحظة</li>
                </ul>
            </div>
        </div>

        <!-- جدول التوقيت -->
        <div class="schedule-wrapper">
            <div class="schedule-table" id="scheduleGrid">
                <!-- سيتم توليد الجدول هنا عبر الجافاسكريبت -->
            </div>
        </div>
    </div>

    <!-- النافذة المنبثقة (Modal) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <h2 id="mSubject">المادة</h2>
            <span class="modal-day" id="mDayProf">اليوم - الأستاذ</span>
            
            <div class="input-group">
                <label style="font-size: 0.9rem; color: var(--text-muted);">القاعة:</label>
                <input type="text" id="mRoom" placeholder="اسم القاعة...">
            </div>

            <div class="input-group">
                <label style="font-size: 0.9rem; color: var(--text-muted);">ملاحظاتك لهذه الحصة (تُحفظ للامتحان):</label>
                <textarea id="mNote" rows="4" placeholder="اكتب هنا أهم النقاط، المراجع، أو أي شيء تريد تذكره..."></textarea>
            </div>

            <label class="checkbox-group">
                <input type="checkbox" id="mRemind">
                <span>تذكيري بهذه الحصة يوم الامتحان</span>
            </label>

            <div class="modal-actions">
                <button class="btn" style="flex: 1;" onclick="saveSessionData()">حفظ البيانات</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">تم الحفظ بنجاح!</div>

    <script>
        // --- 1. قاعدة البيانات المستخرجة من الصورة ---
        const days = ["السبت", "الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس"];
        const times = [
            "08:00 - 09:25", "09:30 - 10:55", "11:00 - 12:25", 
            "12:30 - 13:55", "14:00 - 15:25", "15:30 - 16:55", "17:00 - 18:30"
        ];

        const scheduleData = {
            "السبت": {
                3: { subject: "إدارة الموارد البشرية (م)", prof: "بن دبلة", room: "26" },
                4: { subject: "مدخل إلى علم الاجتماع التنظيم والعمل (أ)", prof: "بداوي عبد القادر", room: "26" },
                5: { subject: "لغة (انجليزية 1) (م)", prof: "أستاذ مكلف", room: "بدون قاعة" }
            },
            "الأحد": {
                0: { subject: "البرمجة والذكاء الاصطناعي 1 (أ)", prof: "تارزي محمد", room: "17" },
                1: { subject: "التنظيم والعمل (م)", prof: "تارزي محمد", room: "17" },
                2: { subject: "مدخل إلى علم الاجتماع التنظيم والعمل 1 (م)", prof: "هراو خثير", room: "بدون قاعة" },
                4: { subject: "مكاملة وتحميل الملفات الكمية في علم الاجتماع (أ)", prof: "بن نايم", room: "بدون قاعة" },
                5: { subject: "مكاملة وتحميل الملفات الكمية في علم الاجتماع (م)", prof: "بن نايم", room: "6" }
            },
            "الإثنين": {
                0: { subject: "منهجية البحث في علم الاجتماع التنظيم والعمل 1 (أ)", prof: "تونسي", room: "17" },
                1: { subject: "العلاقات العامة (م)", prof: "تونسي", room: "بدون قاعة" },
                2: { subject: "إدارة الموارد البشرية (م)", prof: "صديقي خوخة", room: "18" },
                3: { subject: "علم الاجتماع التنمية (م)", prof: "صديقي خوخة", room: "26" }
            },
            "الثلاثاء": {}, // فارغ
            "الأربعاء": {
                0: { subject: "نظريات التنظيم 1 (أ)", prof: "براهيمي بلقاسم", room: "17" },
                3: { subject: "علم النفس الاجتماعي للعمل (م)", prof: "الموهوب بوعلام", room: "بدون قاعة" },
                4: { subject: "علم النفس الاجتماعي للعمل (أ)", prof: "بلحماري بشير", room: "المكتبة 1" },
                5: { subject: "نظريات التنظيم 1 (م)", prof: "براهيمي بلقاسم", room: "بدون قاعة" }
            },
            "الخميس": {} // فارغ
        };

        let currentSessionKey = "";

        // --- 2. توليد الجدول ---
        function renderSchedule() {
            const grid = document.getElementById('scheduleGrid');
            grid.innerHTML = "";

            // خلية فارغة أعلى الجدول
            grid.innerHTML += `<div class="s-header" style="background: transparent; border: none;"></div>`;
            
            // رؤوس الأوقات
            times.forEach((time, index) => {
                grid.innerHTML += `<div class="s-header">الحصة ${index + 1}<br><span style="font-size: 0.75rem; color: var(--text-muted);">${time}</span></div>`;
            });

            // الأيام والحصص
            days.forEach(day => {
                grid.innerHTML += `<div class="s-day">${day}</div>`;
                times.forEach((_, index) => {
                    const session = scheduleData[day][index];
                    const cellKey = `${day}_${index}`;
                    
                    if (session) {
                        // التحقق من وجود بيانات محفوظة سابقاً (ملاحظات)
                        const savedData = JSON.parse(localStorage.getItem(`session_${cellKey}`)) || {};
                        const noteIndicator = savedData.note ? '<div style="position:absolute; top:5px; left:5px; font-size:0.8rem;" title="يوجد ملاحظة">📝</div>' : '';
                        
                        grid.innerHTML += `
                            <div class="s-cell" onclick="openModal('${day}', ${index}, '${session.subject}', '${session.prof}', '${session.room}')">
                                ${noteIndicator}
                                <div class="s-subject">${session.subject}</div>
                                <div class="s-prof">د. ${session.prof}</div>
                                <div class="s-room">${savedData.room || session.room}</div>
                            </div>
                        `;
                    } else {
                        grid.innerHTML += `<div class="s-cell empty"></div>`;
                    }
                });
            });
        }

        // --- 3. إدارة النافذة المنبثقة (Modal) ---
        function openModal(day, timeIndex, subject, prof, room) {
            currentSessionKey = `${day}_${timeIndex}`;
            
            document.getElementById('mSubject').innerText = subject;
            document.getElementById('mDayProf').innerText = `${day} | د. ${prof} | ${times[timeIndex]}`;
            
            // تحديث الشريط العلوي
            const activeBar = document.getElementById('activeBar');
            activeBar.style.display = 'flex';
            document.getElementById('abDay').innerText = day;
            document.getElementById('abSubject').innerText = subject;
            document.getElementById('abProf').innerText = `د. ${prof}`;

            // جلب البيانات المحفوظة مسبقاً إن وجدت
            const savedData = JSON.parse(localStorage.getItem(`session_${currentSessionKey}`)) || {};
            document.getElementById('mRoom').value = savedData.room || room;
            document.getElementById('mNote').value = savedData.note || "";
            document.getElementById('mRemind').checked = savedData.remind || false;

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        // --- 4. حفظ بيانات الحصة ---
        function saveSessionData() {
            const room = document.getElementById('mRoom').value;
            const note = document.getElementById('mNote').value;
            const remind = document.getElementById('mRemind').checked;

            if (!currentSessionKey) return;

            const data = { room, note, remind };
            localStorage.setItem(`session_${currentSessionKey}`, JSON.stringify(data));
            
            closeModal();
            renderSchedule();
            renderExamNotes();
            showToast();
        }

        // --- 5. عرض ملاحظات الامتحان ---
        function renderExamNotes() {
            const list = document.getElementById('examNotesList');
            list.innerHTML = "";
            let hasNotes = false;

            days.forEach(day => {
                for (let i = 0; i < 7; i++) {
                    const key = `${day}_${i}`;
                    const savedData = JSON.parse(localStorage.getItem(`session_${key}`));
                    
                    if (savedData && savedData.note) {
                        hasNotes = true;
                        const sessionInfo = scheduleData[day][i] || { subject: "غير محدد", prof: "" };
                        list.innerHTML += `
                            <li class="list-item" style="border-right-color: ${savedData.remind ? 'var(--warning)' : 'var(--primary)'}; align-items: flex-start; flex-direction: column;">
                                <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 5px;">
                                    <strong style="color: var(--primary);">${sessionInfo.subject}</strong>
                                    <span style="font-size: 0.75rem; color: var(--text-muted);">${day}</span>
                                </div>
                                <p style="font-size: 0.85rem; color: #cbd5e1; margin-top: 5px;">${savedData.note}</p>
                                ${savedData.remind ? '<span style="font-size: 0.7rem; color: var(--warning); margin-top: 5px;">🔔 مطلوب تذكير</span>' : ''}
                            </li>
                        `;
                    }
                }
            });

            if (!hasNotes) {
                list.innerHTML = `<li class="list-item" style="justify-content: center; color: var(--text-muted); border: none;">لا توجد ملاحظات محفوظة بعد.</li>`;
            }
        }

        // --- 6. البحث والتذكيرات ---
        function addSearch() {
            const title = document.getElementById('searchTitle').value;
            const val = document.getElementById('searchValue').value;
            if (!title || !val) return showToast("يرجى ملء الحقول", true);

            const list = document.getElementById('searchList');
            const li = document.createElement('li');
            li.className = 'list-item';
            li.innerHTML = `<span><strong>${title}</strong> - ${val}</span>`;
            list.appendChild(li);
            
            document.getElementById('searchTitle').value = "";
            document.getElementById('searchValue').value = "";
            showToast();
        }

        function addReminder() {
            const input = document.getElementById('reminderInput');
            const val = input.value;
            if (!val) return;

            const list = document.getElementById('reminderList');
            const li = document.createElement('li');
            li.className = 'list-item';
            li.innerHTML = `<span>🔔 ${val}</span> <button onclick="this.parentElement.remove()" style="background:none; border:none; color:var(--danger); cursor:pointer;">✕</button>`;
            list.appendChild(li);
            
            input.value = "";
            showToast();
        }

        // --- 7. الإشعارات (Toast) ---
        function showToast(msg = "تم الحفظ بنجاح!", isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // التشغيل عند فتح الصفحة
        window.onload = () => {
            renderSchedule();
            renderExamNotes();
        };
