
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>براهيمي يوسف | نشرجيلكم تلفونات</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101827;color:white;
  font-family:Arial,sans-serif;text-align:center
}
main{
  max-width:520px;margin:25px auto;padding:22px
}
h1{color:#facc15;font-size:29px}
img{
  width:100%;border-radius:16px;
  border:3px solid #facc15
}
.card{
  background:#1f2937;padding:20px;
  border-radius:16px;margin-top:18px
}
label{display:block;margin:15px 0 8px}
input{
  width:100%;padding:14px;border:0;
  border-radius:10px;font-size:19px;text-align:center
}
button{
  width:100%;padding:14px;margin-top:13px;
  border:0;border-radius:10px;
  background:#facc15;color:#111827;
  font-size:20px;font-weight:bold;cursor:pointer
}
#result{
  display:none;background:#7f1d1d;
  padding:15px;border-radius:12px;
  margin-top:15px;line-height:1.8
}
footer{color:#cbd5e1;margin-top:22px}
</style>
</head>
<body>
<main>
  <h1>⚡ نشرجيلكم تلفونات ههههه ⚡</h1>
  <p>صاحب الوكالة: <strong>براهيمي يوسف</strong></p>

  <img
    src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=900&q=80"
    alt="الكهرباء">

  <section class="card">
    <h2>🔌 وكالة الدفع قبل التشغيل</h2>
    <p>الضوء ما يشعلش بالدعاء وحده 😂</p>

    <label for="amount">💰 اكتب المبلغ الذي تريد دفعه (دج)</label>
    <input id="amount" type="number" min="1"
           placeholder="مثلاً: 100">

    <button onclick="pay()">ادفع ههههه 😂</button>

    <div id="result" role="status"></div>
  </section>

  <footer>
    برمجة وتطوير: براهيمي يوسف<br>
    ⚠️ الدفع هنا مزاح فقط، لا توجد عملية مالية حقيقية.
  </footer>
</main>

<script>
function pay(){
  const amount = document.getElementById("amount").value;
  const result = document.getElementById("result");

  result.style.display = "block";

  if(!amount || Number(amount) <= 0){
    result.textContent = "اكتب المبلغ أولاً يا خويا 😂";
    return;
  }

  result.textContent =
    "تم تسجيل طلب الدفع الوهمي بمبلغ " +
    Number(amount).toLocaleString("ar-DZ") +
    " دج 😂⚡ بقي غير يرجع الضوء! نشرجيلكم تلفونات ههههه";
}
</script>
</body>
</html>
