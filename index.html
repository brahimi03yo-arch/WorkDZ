
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#111827">
    <meta property="og:title" content="اختر هديتك 🎁">
    <meta property="og:description"
          content="اكتشف دعاءً جميلًا وهدية رمزية خاصة بك.">
    <meta property="og:type" content="website">

    <title>اختر هديتك | دعاء وهدية</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Tahoma, Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top, #45558e, transparent 50%),
                linear-gradient(145deg, #10172f, #25163e, #090d1a);
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 540px;
            padding: 32px 24px;
            text-align: center;
            border: 1px solid #ffffff30;
            border-radius: 28px;
            background: #ffffff12;
            box-shadow: 0 20px 70px #0006;
            backdrop-filter: blur(14px);
        }

        .brand {
            color: #f7d98b;
            font-size: 14px;
        }

        h1 {
            margin: 14px 0;
            font-size: clamp(28px, 7vw, 42px);
        }

        .description {
            color: #d9def5;
            line-height: 1.9;
        }

        .gift-icon {
            margin: 20px 0;
            font-size: 78px;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(-4deg);
            }
            50% {
                transform: translateY(-12px) rotate(4deg);
            }
        }

        .panel {
            padding: 22px 16px;
            border: 1px solid #ffffff20;
            border-radius: 20px;
            background: #080d204d;
        }

        .label {
            margin-bottom: 12px;
            color: #f7d98b;
            font-size: 14px;
        }

        #dua {
            font-size: 20px;
            line-height: 2;
        }

        #gift {
            margin-top: 14px;
            color: #ffe5a2;
            font-size: 23px;
            font-weight: bold;
        }

        button {
            width: 100%;
            margin-top: 14px;
            padding: 15px;
            border: 0;
            border-radius: 14px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary {
            color: #241a08;
            background: linear-gradient(100deg, #ffe6a1, #d7a640);
        }

        .secondary {
            color: white;
            background: #ffffff12;
            border: 1px solid #ffffff30;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            min-height: 28px;
            margin-top: 12px;
            color: #ffe7ad;
            line-height: 1.8;
        }

        .footer {
            margin-top: 20px;
            color: #c2c9e2;
            font-size: 12px;
            line-height: 1.9;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="brand">✦ لحظة جميلة لك ✦</div>

        <h1>اختر هديتك</h1>

        <p class="description">
            افتح نافذتك للأمل واكتشف دعاءً جميلًا
            وهدية رمزية اختيرت لك.
        </p>

        <div class="gift-icon">🎁</div>

        <section class="panel">
            <div class="label">الدعاء الخاص بك</div>
            <div id="dua">جارٍ تجهيز دعائك...</div>
            <div id="gift"></div>
        </section>

        <button id="claimBtn" class="primary">
            استلام الهدية الرمزية
        </button>

        <button id="shareBtn" class="secondary">
            مشاركة الرابط
        </button>

        <div id="message" role="status"></div>

        <div class="footer">
            برمجة وتطوير براهيمي يوسف
            <br>
            الهدايا المعروضة رمزية ومعنوية وليست جوائز مادية.
        </div>
    </main>

    <script>
        const duaElement = document.getElementById("dua");
        const giftElement = document.getElementById("gift");
        const claimButton = document.getElementById("claimBtn");
        const messageElement = document.getElementById("message");

        async function loadGift() {
            try {
                const response = await fetch("/data", {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("تعذر تحميل البيانات");
                }

                const data = await response.json();

                duaElement.textContent = data.dua;
                giftElement.textContent = data.gift;

                if (data.claimed) {
                    claimButton.disabled = true;
                    claimButton.textContent = "تم الاستلام من قبل";
                    messageElement.textContent =
                        "لقد استلمت هديتك الرمزية من قبل.";
                }
            } catch (error) {
                duaElement.textContent =
                    "تعذر تحميل الدعاء. حاول تحديث الصفحة.";
            }
        }

        claimButton.addEventListener("click", async () => {
            claimButton.disabled = true;

            try {
                const response = await fetch("/claim", {
                    method: "POST"
                });

                const result = await response.json();

                messageElement.textContent = result.message;

                if (result.success || response.status === 409) {
                    claimButton.textContent = "تم الاستلام من قبل";
                } else {
                    claimButton.disabled = false;
                }
            } catch (error) {
                messageElement.textContent =
                    "تعذر الاتصال. حاول مرة أخرى.";
                claimButton.disabled = false;
            }
        });

        document.getElementById("shareBtn")
            .addEventListener("click", async () => {
                try {
                    if (navigator.share) {
                        await navigator.share({
                            title: "اختر هديتك",
                            text: "اكتشف دعاءً وهدية رمزية جميلة.",
                            url: location.href
                        });
                    } else {
                        await navigator.clipboard.writeText(location.href);
                        messageElement.textContent = "تم نسخ الرابط.";
                    }
                } catch (error) {
                    messageElement.textContent =
                        "يمكنك نسخ الرابط من شريط العنوان.";
                }
            });

        loadGift();
    </script>
</body>
</html>
