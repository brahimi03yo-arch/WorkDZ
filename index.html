
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRAHIMI AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Tahoma,Arial}
header{display:flex;align-items:center;gap:20px;justify-content:space-between;padding:15px 5%;background:#111a30;direction:ltr;flex-wrap:wrap}
.brand{font-size:21px;font-weight:bold;color:#56d7ff}
.dev{font-size:12px;color:#c4d3ed;margin-top:5px}
.marquee{flex:1;min-width:180px;overflow:hidden;background:#1a2943;border-radius:30px;padding:10px}
.marquee span{display:inline-block;white-space:nowrap;color:#65dfff;animation:move 13s linear infinite}
@keyframes move{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
main{max-width:750px;margin:45px auto;padding:15px}
h1{text-align:center}
.subtitle{text-align:center;color:#9fb1ce;margin-bottom:30px}
.panel{background:#131e35;padding:22px;border:1px solid #2c4164;border-radius:18px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
button{cursor:pointer}
.tabs button{flex:1;padding:13px;border:0;border-radius:10px;background:#263653;color:white}
.tabs button.active{background:#087fae}
textarea{width:100%;height:140px;padding:15px;background:#0c1427;color:white;border:1px solid #344a6b;border-radius:12px;font-size:15px;resize:vertical}
.generate{width:100%;padding:15px;margin-top:17px;background:linear-gradient(90deg,#087fae,#5148d9);color:white;border:0;border-radius:12px;font-size:17px;font-weight:bold}
.generate:disabled{opacity:.5}
#status{text-align:center;margin:20px 0;color:#8ddfff}
#result{display:none;margin-top:20px;padding:15px;background:#0b1427;border-radius:12px;overflow-wrap:anywhere}
#result video,#result img{width:100%;border-radius:10px;margin-top:10px}
#result a{color:#65dfff}
footer{text-align:center;color:#8293ae;padding:30px;font-size:12px}
</style>
</head>
<body>

<header>
 <div>
  <div class="brand">BRAHIMI AI</div>
  <div class="dev">Developer: BRAHIMI YOUSEF</div>
 </div>
 <div class="marquee">
  <span>تطبيق بسيط لتوليد فيديوهات وصور بالذكاء الاصطناعي • BRAHIMI AI •</span>
 </div>
</header>

<main>
 <h1>اصنع فكرتك بالذكاء الاصطناعي</h1>
 <div class="subtitle">حوّل وصفك إلى فيديو أو صورة</div>

 <section class="panel">
  <div class="tabs">
   <button id="videoTab" class="active" onclick="setMode('video')">🎬 إنشاء فيديو</button>
   <button id="imageTab" onclick="setMode('image')">🎨 إنشاء صورة</button>
  </div>

  <label id="label">اكتب وصف الفيديو</label>
  <textarea id="prompt" placeholder="مثلاً: منظر طبيعي جميل وشلال وقت الغروب..."></textarea>

  <button class="generate" id="generateBtn" onclick="generate()">✨ ابدأ الإنشاء</button>

  <div id="status"></div>
  <div id="result"></div>
 </section>
</main>

<footer>برمجة وتطوير BRAHIMI YOUSEF © 2026</footer>

<script>
let mode = "video";

function setMode(value){
 mode=value;
 document.getElementById("videoTab").classList.toggle("active",mode==="video");
 document.getElementById("imageTab").classList.toggle("active",mode==="image");
 document.getElementById("label").textContent =
 mode==="video" ? "اكتب وصف الفيديو" : "اكتب وصف الصورة";
 document.getElementById("prompt").placeholder =
 mode==="video" ? "صف الفيديو الذي تريد إنشاءه..." : "صف الصورة التي تريد إنشاءها...";
 document.getElementById("result").style.display="none";
 document.getElementById("status").textContent="";
}

async function generate(){
 const prompt=document.getElementById("prompt").value.trim();
 const btn=document.getElementById("generateBtn");
 const status=document.getElementById("status");
 const result=document.getElementById("result");

 if(!prompt){status.textContent="اكتب وصفاً أولاً";return;}

 btn.disabled=true;
 status.textContent="جارٍ إرسال طلب الإنشاء...";
 result.style.display="none";

 try{
  const response=await fetch("/api/"+mode,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({prompt})
  });

  const data=await response.json();

  if(!response.ok || data.error){
   throw new Error(typeof data.error==="string"?data.error:JSON.stringify(data.error));
  }

  result.style.display="block";
  result.innerHTML="<b>استجابة الخدمة:</b><pre style='white-space:pre-wrap;direction:ltr'></pre>";
  result.querySelector("pre").textContent=JSON.stringify(data,null,2);

  const url=findUrl(data);
  if(url){
   const media=document.createElement(mode==="video"?"video":"img");
   media.src=url;
   if(mode==="video"){
    media.controls=true;
    media.playsInline=true;
   }
   result.appendChild(media);

   const link=document.createElement("a");
   link.href=url;
   link.target="_blank";
   link.rel="noopener";
   link.textContent="فتح النتيجة";
   result.appendChild(link);
  }

  status.textContent="وصل رد من الخدمة. تحقق من النتيجة أدناه.";
 }catch(error){
  status.textContent="تعذر الإنشاء: "+error.message;
 }finally{
  btn.disabled=false;
 }
}

function findUrl(obj){
 if(!obj || typeof obj!=="object")return null;
 for(const key of ["video_url","image_url","url","output_url"]){
  if(typeof obj[key]==="string" && /^https?:\/\//i.test(obj[key]))return obj[key];
 }
 for(const value of Object.values(obj)){
  if(Array.isArray(value)){
   for(const item of value){
    const found=findUrl(item);
    if(found)return found;
   }
  }else if(value && typeof value==="object"){
   const found=findUrl(value);
   if(found)return found;
  }
 }
 return null;
}
</script>
</body>
</html>
