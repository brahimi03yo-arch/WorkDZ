
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07152e">
<title>انتهت مدة العمل</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    color:white;
    background:radial-gradient(circle at top,#204b7b,transparent 60%),
    linear-gradient(135deg,#061126,#102b4e,#050b18);
}
.container{
    width:92%;
    max-width:800px;
    text-align:center;
    padding:25px 12px;
}
.icon{
    font-size:65px;
    animation:float 3s ease-in-out infinite;
}
h1{
    color:#ffd66b;
    font-size:clamp(26px,5vw,42px);
}
.message{
    font-size:clamp(18px,4vw,25px);
    line-height:2;
    color:#edf4ff;
}
.ticker{
    width:100%;
    overflow:hidden;
    white-space:nowrap;
    border:1px solid #d8b85c;
    border-radius:14px;
    background:#061126a8;
    padding:18px 0;
    margin-top:30px;
}
.track{
    display:flex;
    width:max-content;
    animation:move 13s linear infinite;
}
.track span{
    flex-shrink:0;
    padding-left:35px;
    font-size:clamp(18px,4vw,27px);
    font-weight:bold;
    color:#ffd66b;
}
.footer{
    margin-top:35px;
    color:#b6c6dc;
    font-size:14px;
}
@keyframes move{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
}
@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}
@media(prefers-reduced-motion:reduce){
    .track,.icon{animation:none}
    .track{width:100%;justify-content:center}
    .track span:last-child{display:none}
    .track span{white-space:normal;padding:0 8px}
}
</style>
</head>

<body>
<main class="container">
    <div class="icon">⏳</div>

    <h1>انتهت مدة العمل</h1>

    <p class="message">
        نشكركم على جهودكم وتعاونكم.<br>
        نتمنى لكم دوام التوفيق والنجاح.
    </p>

    <div class="ticker">
        <div class="track">
            <span>✨ انتهت مدة العمل — نتمنى لكم التوفيق ✨</span>
            <span aria-hidden="true">✨ انتهت مدة العمل — نتمنى لكم التوفيق ✨</span>
        </div>
    </div>

    <div class="footer">
        مع تمنياتنا لكم بمستقبل مليء بالنجاح والإنجاز
    </div>
</main>
</body>
</html>
